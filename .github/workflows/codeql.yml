name: PUI89 CodeQL security analysis

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/**"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python, actions
      - uses: github/codeql-action/analyze@v4
